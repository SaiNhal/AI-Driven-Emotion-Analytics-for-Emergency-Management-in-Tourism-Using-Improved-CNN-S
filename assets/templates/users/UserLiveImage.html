{%extends 'users/userbase.html'%}
{%load static%}

{%block contents%}
<div class="features">
		<div class="container">
			<div class="row">
				<div class="col">
					<div class="section_title_container text-center">
						 
					</div>
                    <h2>Results table</h2>
										 <font color="Black">
                                                  <table border="2px" class="table table-hover table-dark">
                    <thead>
                    <tr class="table-danger">
                        <th scope="col">S.No</th>
                        <th scope="col">User Name</th>
                        <th scope="col">File Name</th>
                        <th scope="col">Emotions</th>
                        <th scope="col">File</th>
                        <th scope="col">Date</th>
                        <th scope="col">Image</th>
                        <th scope="col">Download</th> 
                    </tr>
                    </thead>
                    <tbody>
                    {% for i in data %}
                    <tr scope="row" style="color: BLUE; background-color:#FFFCBB">
                        <td>{{forloop.counter}}</td>
                        <td>{{i.username}}</td>
                        <td>{{i.filename}}</td>
                        <td>{{i.emotions}}</td>
                        <td>{{i.file}}</td>
                        <td>{{i.cdate}}</td>
                        <td><img src="{{i.file}}" width="45" height="40"> </td>
						<td><a class="btn-link" href="{{ i.file }}" target="_blank">Download</a></td> 
                    </tr>
                    {% endfor %}
                    </tbody>
                </table>

				</div>
			</div>
			<div class="row features_row">


			</div>
		</div>
	</div>
{%endblock%}
